lend_game:
  name: Lend game
  description: Record that a physical game copy has been lent to someone.
  fields:
    copy_id:
      name: Copy ID
      required: true
      selector:
        text:
    borrower:
      name: Borrower
      required: true
      selector:
        text:
    due_date:
      name: Due date
      description: Optional due date in YYYY-MM-DD format.
      selector:
        text:
    notes:
      name: Notes
      selector:
        text:
    config_entry_id:
      name: Collection entry ID
      selector:
        text:

return_game:
  name: Return game
  description: Mark a currently lent physical copy as returned.
  fields:
    copy_id:
      name: Copy ID
      required: true
      selector:
        text:
    config_entry_id:
      name: Collection entry ID
      selector:
        text:

register_copy:
  name: Register physical copy
  description: Add a physical copy that is not represented by the imported collection.
  fields:
    game:
      name: Game
      required: true
      selector:
        text:
    platform:
      name: Platform
      selector:
        text:
    notes:
      name: Notes
      selector:
        text:
    config_entry_id:
      name: Collection entry ID
      selector:
        text:

update_inventory:
  name: Update inventory notes
  description: Update the notes attached to a physical copy. Use an empty value to clear the notes.
  fields:
    copy_id:
      name: Copy ID
      required: true
      selector:
        text:
    notes:
      name: Notes
      required: true
      selector:
        text:
    config_entry_id:
      name: Collection entry ID
      selector:
        text:

resolve_inventory_match:
  name: Resolve inventory match
  description: Resolve an uncertain match between an imported row and physical inventory.
  fields:
    copy_id:
      name: Copy ID
      required: true
      selector:
        text:
    resolution:
      name: Resolution
      required: true
      selector:
        select:
          options:
            - present
            - not_present
            - manual
    config_entry_id:
      name: Collection entry ID
      selector:
        text:

refresh_collection:
  name: Refresh collection
  description: Fetch the latest public DekuDeals JSON export and reconcile it with the physical inventory.
  fields:
    config_entry_id:
      name: Collection entry ID
      selector:
        text:

refresh_artwork:
  name: Refresh artwork
  description: Retry TheGamesDB artwork lookups for cached collection items without changing inventory, loans, or lending history.
  fields:
    config_entry_id:
      name: Collection entry ID
      selector:
        text:

diagnose_artwork:
  name: Diagnose artwork
  description: Test the selected game's TheGamesDB CDN image from the Home Assistant host and create a diagnostic notification.
  fields:
    game_name:
      name: Game name
      description: Game title to locate in the selected collection. Defaults to Bluey.
      selector:
        text:
    config_entry_id:
      name: Collection entry ID
      selector:
        text:
